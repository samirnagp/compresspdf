services:
  - type: web
    name: easypdf-compressor
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 4 --max-requests 50 --timeout 120 app:app"
    envVars:
      - key: PORT
        value: 10000
        gunicorn --workers 1 --threads 8 --worker-class gthread --max-requests 100 --timeout 120 app:app
